<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <main class="container">
            <h1 class="title">Generate a <span class="green-text">random password</span></h1>
            <p class="text">Never use an insecure password again.</p>
            <input type="number" placeholder="12" id="length-input" value="16"><br>
            <div class="check-container">
                <input type="checkbox" id="symbols">
                <label for="symbols">Symbols</label>
            </div>
            <div class="check-container">
                <input type="checkbox" id="numbers">
                <label for="numbers">Numbers</label>
            </div>
            <button id="gen-btn" class="btn">Generate passwords</button>
            <hr class="horizontal-lane">
            <div class="pass-container">
                <button id="first-pass" class="pass-btn"></button>
                <button id="second-pass" class="pass-btn"></button>
            </div>
        </main>
        <script src="index.js"></script>
    </body>
</html>
